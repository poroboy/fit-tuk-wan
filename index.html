<!doctype html>
<html lang="th">

<title>ฟิตทุกวัน</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF2E00"/>
      <stop offset=".55" stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FFD54F"/>
    </linearGradient>
    <linearGradient id="flameGradBlue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2962FF"/>
      <stop offset=".6" stop-color="#00B0FF"/>
      <stop offset="1" stop-color="#B3E5FC"/>

  </defs>
</svg>

  <main id="view" class="view"></main>
  <nav class="tabbar" id="tabbar">
    <a href="#/home" data-tab="home">
